# CADAM (JotaLabs fork) - local SonarQube analysis
# Run from repo root: pnpm sonar
# Configure SONAR_HOST_URL and SONAR_TOKEN in your environment.
sonar.projectKey=jotalabs-cadam
sonar.projectName=CADAM (JotaLabs)
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.sources=src,shared
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/coverage/**,**/*.d.ts,**/vendor/**,**/*.generated.*,**/routeTree.gen.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.d.ts,**/vendor/**,**/routeTree.gen.ts
sonar.qualitygate.wait=true
